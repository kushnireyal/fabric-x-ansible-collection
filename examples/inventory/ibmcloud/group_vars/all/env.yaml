# =========================
# Ansible Connection
# =========================
ansible_connection: ssh
ansible_user: root
ansible_python_interpreter: /usr/bin/python3
# actual_host resolves to the remote host when ansible_connection is ssh.
actual_host: "{{ ansible_host }}"

# =========================
# IBM Cloud VM endpoints
# Fill these in before running any playbook.
# =========================
# Single VM hosting all 4 orderer groups (router/consenter/assembler/batcher)
ibm_orderer_1: "FILL_IN_ORDERER_VM_IP"
# Single VM hosting the full committer stack (sidecar, coordinator, query-service,
# 2 validators, 2 verifiers) and YugabyteDB (1 master + 2 tablets)
ibm_committer_1: "FILL_IN_COMMITTER_VM_IP"
# Five VMs for EVM gateway replicas + workload generators (one per namespace)
ibm_evm_1: "FILL_IN_EVM_1_VM_IP"
ibm_evm_2: "FILL_IN_EVM_2_VM_IP"
ibm_evm_3: "FILL_IN_EVM_3_VM_IP"
ibm_evm_4: "FILL_IN_EVM_4_VM_IP"
ibm_evm_5: "FILL_IN_EVM_5_VM_IP"
# Monitoring VM (Prometheus + Grafana)
ibm_monitoring_1: "FILL_IN_MONITORING_VM_IP"

# =========================
# Remote Node Paths
# =========================
# Point remote_deploy_dir at the SSD mount if available.
remote_deploy_dir: "/data/fabricx-demo"
remote_node_dir: "{{ remote_deploy_dir }}/{{ inventory_hostname }}"
remote_config_dir: "{{ remote_node_dir }}/config"
remote_data_dir: "{{ remote_node_dir }}/data"
