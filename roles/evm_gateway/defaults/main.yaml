---

# Automatically generated by aar-doc. DO NOT EDIT MANUALLY.

# Namespace this EVM gateway node operates on (unique per replica in multi-replica deployments).
evm_gateway_namespace: "evm-ns-1"
# Fabric-X network protocol.
evm_gateway_protocol: "fabric-x"
# Fabric channel name.
# Populated from the shared C(channel_id) inventory variable by default.
evm_gateway_channel: "{{ channel_id }}"
# Chaincode namespace version.
evm_gateway_ns_version: "1.0"
# EVM chain ID presented in JSON-RPC responses.
evm_gateway_chain_id: 4011
# Run the binary runtime.
evm_gateway_use_bin: false
# Use Kubernetes resources.
evm_gateway_use_k8s: false
# Run the container runtime.
evm_gateway_use_container: "{{ (not evm_gateway_use_bin) and (not evm_gateway_use_k8s) }}"
# JSON-RPC listen port exposed by the EVM gateway.
evm_gateway_rpc_port: 8545
# Prometheus metrics port.
evm_gateway_metrics_port: 9090
# Enable TLS for connections to orderers and committer.
evm_gateway_use_tls: true
# Enable mTLS for connections to orderers and committer.
evm_gateway_use_mtls: true
# Enable TLS for the metrics endpoint.
evm_gateway_monitoring_use_tls: "{{ evm_gateway_use_tls }}"
# Enable mTLS for the metrics endpoint.
evm_gateway_monitoring_use_mtls: "{{ evm_gateway_use_mtls }}"
# Image registry endpoint.
evm_gateway_registry_endpoint: "{{ lookup('env', 'EVM_GATEWAY_REGISTRY_ENDPOINT') or 'docker.io/hyperledger' }}"
# Image name used by the EVM gateway container.
evm_gateway_image_name: fabric-x-evm-gateway
# Image tag used by the EVM gateway container.
evm_gateway_image_tag: latest
# EVM gateway container image.
evm_gateway_image: "{{ evm_gateway_registry_endpoint }}/{{ evm_gateway_image_name }}:{{ evm_gateway_image_tag }}"
# Container name used by the runtime.
evm_gateway_container_name: "{{ inventory_hostname }}"
# Remote config directory used by the EVM gateway.
evm_gateway_remote_config_dir: "{{ remote_config_dir }}"
# Remote data directory for persistent SQLite and trie state.
evm_gateway_remote_data_dir: "{{ remote_data_dir }}"
# Config mount path inside a container.
evm_gateway_container_config_dir: /config
# Data mount path inside a container.
evm_gateway_container_data_dir: /data
# Effective config directory used inside rendered EVM gateway configuration.
evm_gateway_config_dir: "{{ evm_gateway_remote_config_dir if evm_gateway_use_bin else evm_gateway_container_config_dir }}"
# Effective data directory used inside rendered EVM gateway configuration.
evm_gateway_data_dir: "{{ evm_gateway_remote_data_dir if evm_gateway_use_bin else evm_gateway_container_data_dir }}"
# Rendered EVM gateway config filename.
evm_gateway_config_file: config-evm-gateway.yaml
# SQLite connection string for gateway blocks, transactions, and logs.
evm_gateway_db_conn_string: "file:{{ evm_gateway_data_dir }}/gateway.db"
# PebbleDB trie directory for state root computation; empty disables the trie.
evm_gateway_trie_path: ""
# SQLite connection string for the embedded endorser state store.
evm_gateway_endorser_db_conn_string: "file:{{ evm_gateway_data_dir }}/endorser.db"
# Number of parallel transaction worker goroutines.
evm_gateway_worker_count: 4
# Maximum time to wait for the endorser to sync on startup.
evm_gateway_sync_timeout: "5m"
# Crypto material base name (peer hostname used for MSP/TLS file paths).
evm_gateway_crypto_name: "{{ organization.peer.name | default(inventory_hostname) }}"
# Log level emitted by the EVM gateway.
evm_gateway_log_level: info
