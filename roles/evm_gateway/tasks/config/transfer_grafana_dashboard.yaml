- name: Set Grafana dashboard path to copy
  # set as fact before calling the method allows to evaluate `role_path` in the right role
  ansible.builtin.set_fact:
    evm_gateway_grafana_dashboard_path: "{{ role_path }}/files/evm-loadgen-dashboard.json"

- name: Transfer the Fabric-X EVM Loadgen Grafana Dashboard
  vars:
    grafana_dashboard_file: "evm-loadgen-dashboard.json"
    grafana_dashboard_path: "{{ evm_gateway_grafana_dashboard_path }}"
  ansible.builtin.include_role:
    name: hyperledger.fabricx.grafana
    tasks_from: config/copy_dashboard
