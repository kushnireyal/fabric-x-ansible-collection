---
argument_specs:
  role-options:
    short_description: Shared option catalog for evm_gateway role entry points
    options:
      evm_gateway_namespace: &evm_gateway_namespace
        type: str
        default: "evm-ns-1"
        description:
          - Fabric chaincode namespace this EVM gateway operates on.
          - Must be unique per replica in multi-replica deployments.
          - "Example: C(evm-ns-1)."
      evm_gateway_protocol: &evm_gateway_protocol
        type: str
        default: "fabric-x"
        description:
          - Fabric-X network protocol.
          - "Example: C(fabric-x)."
      evm_gateway_channel: &evm_gateway_channel
        type: str
        default: "{{ channel_id }}"
        description:
          - Fabric channel name.
      evm_gateway_ns_version: &evm_gateway_ns_version
        type: str
        default: "1.0"
        description:
          - Chaincode namespace version string.
      evm_gateway_chain_id: &evm_gateway_chain_id
        type: int
        default: 4011
        description:
          - EVM chain ID returned in JSON-RPC responses.
      evm_gateway_use_bin: &evm_gateway_use_bin
        type: bool
        default: false
        description:
          - Run the binary runtime.
      evm_gateway_use_k8s: &evm_gateway_use_k8s
        type: bool
        default: false
        description:
          - Use Kubernetes resources.
      evm_gateway_use_container: &evm_gateway_use_container
        type: bool
        default: "{{ (not evm_gateway_use_bin) and (not evm_gateway_use_k8s) }}"
        description:
          - Run the container runtime.
      evm_gateway_rpc_port: &evm_gateway_rpc_port
        type: int
        description:
          - JSON-RPC listen port exposed by the EVM gateway.
          - "Example: C(8545)."
      evm_gateway_metrics_port: &evm_gateway_metrics_port
        type: int
        description:
          - Prometheus metrics scrape port.
          - "Example: C(9090)."
      evm_gateway_use_tls: &evm_gateway_use_tls
        type: bool
        default: true
        description:
          - Enable TLS for connections to orderers and committer.
      evm_gateway_use_mtls: &evm_gateway_use_mtls
        type: bool
        default: true
        description:
          - Enable mutual TLS for connections to orderers and committer.
      evm_gateway_monitoring_use_tls: &evm_gateway_monitoring_use_tls
        type: bool
        default: "{{ evm_gateway_use_tls }}"
        description:
          - Enable TLS for the metrics endpoint.
      evm_gateway_monitoring_use_mtls: &evm_gateway_monitoring_use_mtls
        type: bool
        default: "{{ evm_gateway_use_mtls }}"
        description:
          - Enable mTLS for the metrics endpoint.
      evm_gateway_registry_endpoint: &evm_gateway_registry_endpoint
        type: str
        default: "{{ lookup('env', 'EVM_GATEWAY_REGISTRY_ENDPOINT') or 'docker.io/hyperledger' }}"
        description:
          - Image registry endpoint.
      evm_gateway_image_name: &evm_gateway_image_name
        type: str
        default: "fabric-x-evm-gateway"
        description:
          - Image name used by the EVM gateway container.
      evm_gateway_image_tag: &evm_gateway_image_tag
        type: str
        default: "latest"
        description:
          - Image tag used by the EVM gateway container.
      evm_gateway_image: &evm_gateway_image
        type: str
        default: "{{ evm_gateway_registry_endpoint }}/{{ evm_gateway_image_name }}:{{ evm_gateway_image_tag }}"
        description:
          - Fully qualified EVM gateway container image.
      evm_gateway_container_name: &evm_gateway_container_name
        type: str
        default: "{{ inventory_hostname }}"
        description:
          - Container name used by the runtime.
      evm_gateway_remote_config_dir: &evm_gateway_remote_config_dir
        type: path
        default: "{{ remote_config_dir }}"
        description:
          - Remote config directory used by the EVM gateway.
      evm_gateway_remote_data_dir: &evm_gateway_remote_data_dir
        type: path
        default: "{{ remote_data_dir }}"
        description:
          - Remote data directory for persistent SQLite and trie state.
      evm_gateway_container_config_dir: &evm_gateway_container_config_dir
        type: path
        default: "/config"
        description:
          - Config mount path inside a container.
      evm_gateway_container_data_dir: &evm_gateway_container_data_dir
        type: path
        default: "/data"
        description:
          - Data mount path inside a container.
      evm_gateway_config_dir: &evm_gateway_config_dir
        type: path
        default: "{{ evm_gateway_remote_config_dir if evm_gateway_use_bin else evm_gateway_container_config_dir }}"
        description:
          - Effective config directory used inside rendered EVM gateway configuration.
      evm_gateway_data_dir: &evm_gateway_data_dir
        type: path
        default: "{{ evm_gateway_remote_data_dir if evm_gateway_use_bin else evm_gateway_container_data_dir }}"
        description:
          - Effective data directory used inside rendered EVM gateway configuration.
      evm_gateway_config_file: &evm_gateway_config_file
        type: str
        default: "config-evm-gateway.yaml"
        description:
          - Rendered EVM gateway config filename.
      evm_gateway_db_conn_string: &evm_gateway_db_conn_string
        type: str
        default: "file:{{ evm_gateway_data_dir }}/gateway.db"
        description:
          - SQLite connection string for gateway blocks, transactions, and logs.
      evm_gateway_trie_path: &evm_gateway_trie_path
        type: str
        default: ""
        description:
          - PebbleDB trie directory for state root computation; empty disables the trie.
      evm_gateway_endorser_db_conn_string: &evm_gateway_endorser_db_conn_string
        type: str
        default: "file:{{ evm_gateway_data_dir }}/endorser.db"
        description:
          - SQLite connection string for the embedded endorser state store.
      evm_gateway_worker_count: &evm_gateway_worker_count
        type: int
        default: 4
        description:
          - Number of parallel transaction worker goroutines.
      evm_gateway_sync_timeout: &evm_gateway_sync_timeout
        type: str
        default: "5m"
        description:
          - Maximum time to wait for the endorser to sync on startup.
          - "Example: C(5m)."
      evm_gateway_crypto_name: &evm_gateway_crypto_name
        type: str
        default: "{{ organization.peer.name | default(inventory_hostname) }}"
        description:
          - Crypto material base name for MSP and TLS file paths.
      evm_gateway_log_level: &evm_gateway_log_level
        type: str
        default: "info"
        description:
          - Log level emitted by the EVM gateway.
          - "Example: C(debug)."

  start:
    short_description: Start the EVM gateway process
    options:
      evm_gateway_use_container: *evm_gateway_use_container
      evm_gateway_use_bin: *evm_gateway_use_bin
      evm_gateway_container_name: *evm_gateway_container_name
      evm_gateway_image: *evm_gateway_image
      evm_gateway_rpc_port: *evm_gateway_rpc_port
      evm_gateway_metrics_port: *evm_gateway_metrics_port
      evm_gateway_remote_config_dir: *evm_gateway_remote_config_dir
      evm_gateway_remote_data_dir: *evm_gateway_remote_data_dir
      evm_gateway_container_config_dir: *evm_gateway_container_config_dir
      evm_gateway_container_data_dir: *evm_gateway_container_data_dir
      evm_gateway_config_file: *evm_gateway_config_file

  stop:
    short_description: Stop the EVM gateway process
    options:
      evm_gateway_use_container: *evm_gateway_use_container
      evm_gateway_use_bin: *evm_gateway_use_bin
      evm_gateway_container_name: *evm_gateway_container_name
      evm_gateway_image: *evm_gateway_image

  teardown:
    short_description: Stop and remove the EVM gateway container or binary process
    options:
      evm_gateway_use_container: *evm_gateway_use_container
      evm_gateway_use_bin: *evm_gateway_use_bin
      evm_gateway_container_name: *evm_gateway_container_name
      evm_gateway_image: *evm_gateway_image

  wipe:
    short_description: Teardown and remove all EVM gateway state (config, crypto, data)
    options:
      evm_gateway_use_container: *evm_gateway_use_container
      evm_gateway_use_bin: *evm_gateway_use_bin
      evm_gateway_container_name: *evm_gateway_container_name
      evm_gateway_image: *evm_gateway_image
      evm_gateway_remote_config_dir: *evm_gateway_remote_config_dir
      evm_gateway_remote_data_dir: *evm_gateway_remote_data_dir

  fetch_logs:
    short_description: Collect logs from the running EVM gateway process
    options:
      evm_gateway_use_container: *evm_gateway_use_container
      evm_gateway_container_name: *evm_gateway_container_name

  ping:
    short_description: Verify the EVM JSON-RPC port is reachable
    options:
      evm_gateway_rpc_port: *evm_gateway_rpc_port

  config/transfer:
    short_description: Render and transfer EVM gateway config to the remote host
    options:
      evm_gateway_namespace: *evm_gateway_namespace
      evm_gateway_protocol: *evm_gateway_protocol
      evm_gateway_channel: *evm_gateway_channel
      evm_gateway_ns_version: *evm_gateway_ns_version
      evm_gateway_chain_id: *evm_gateway_chain_id
      evm_gateway_rpc_port: *evm_gateway_rpc_port
      evm_gateway_remote_config_dir: *evm_gateway_remote_config_dir
      evm_gateway_remote_data_dir: *evm_gateway_remote_data_dir
      evm_gateway_config_file: *evm_gateway_config_file
      evm_gateway_use_tls: *evm_gateway_use_tls
      evm_gateway_use_mtls: *evm_gateway_use_mtls
      evm_gateway_db_conn_string: *evm_gateway_db_conn_string
      evm_gateway_trie_path: *evm_gateway_trie_path
      evm_gateway_endorser_db_conn_string: *evm_gateway_endorser_db_conn_string
      evm_gateway_worker_count: *evm_gateway_worker_count
      evm_gateway_sync_timeout: *evm_gateway_sync_timeout

  crypto/cryptogen/transfer:
    short_description: Copy cryptogen-generated MSP and TLS material to the remote host
    options:
      evm_gateway_remote_config_dir: *evm_gateway_remote_config_dir
      evm_gateway_crypto_name: *evm_gateway_crypto_name
      evm_gateway_use_tls: *evm_gateway_use_tls
      evm_gateway_monitoring_use_tls: *evm_gateway_monitoring_use_tls

  crypto/fetch:
    short_description: Fetch TLS certs from the remote host back to the control node
    options:
      evm_gateway_remote_config_dir: *evm_gateway_remote_config_dir
      evm_gateway_use_tls: *evm_gateway_use_tls
      evm_gateway_monitoring_use_tls: *evm_gateway_monitoring_use_tls

  container/start:
    short_description: Start the EVM gateway Docker container
    options:
      evm_gateway_container_name: *evm_gateway_container_name
      evm_gateway_image: *evm_gateway_image
      evm_gateway_rpc_port: *evm_gateway_rpc_port
      evm_gateway_metrics_port: *evm_gateway_metrics_port
      evm_gateway_remote_config_dir: *evm_gateway_remote_config_dir
      evm_gateway_remote_data_dir: *evm_gateway_remote_data_dir
      evm_gateway_container_config_dir: *evm_gateway_container_config_dir
      evm_gateway_container_data_dir: *evm_gateway_container_data_dir
      evm_gateway_config_file: *evm_gateway_config_file

  container/stop:
    short_description: Stop the EVM gateway Docker container
    options:
      evm_gateway_container_name: *evm_gateway_container_name
      evm_gateway_image: *evm_gateway_image

  container/rm:
    short_description: Remove the EVM gateway Docker container
    options:
      evm_gateway_container_name: *evm_gateway_container_name
      evm_gateway_image: *evm_gateway_image

  container/fetch_logs:
    short_description: Collect logs from the EVM gateway Docker container
    options:
      evm_gateway_container_name: *evm_gateway_container_name
